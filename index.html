<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>江湖 · 一刀</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;color:#e8e0d0}
#stage{position:fixed;left:0;top:0;overflow:hidden;background:#0b0a09;transform-origin:0 0;will-change:transform;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ── 统一 HUD ── */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;touch-action:none}
.hide{opacity:0!important;pointer-events:none!important}
#hud>*{transition:opacity .25s}

/* 左上 状态 */
#status{position:absolute;left:18px;top:12px;width:170px}
.bar{position:relative;height:9px;border-radius:5px;background:rgba(0,0,0,.55);
  box-shadow:inset 0 0 0 1px rgba(212,175,110,.35);overflow:hidden;margin-bottom:6px}
.bar>i{position:absolute;inset:0;width:100%;transform-origin:left center;border-radius:5px;transition:width .12s linear}
#hpF{background:linear-gradient(90deg,#8e1f1f,#d94242 70%,#ef6a5a);box-shadow:0 0 10px rgba(217,66,66,.5)}
#spF{background:linear-gradient(90deg,#2d5a6b,#5fa8bd 70%,#8fd0de);box-shadow:0 0 8px rgba(95,168,189,.45);height:6px}
#qiF{background:linear-gradient(90deg,#4a3a8a,#8a7ce8 70%,#b8a8ff);box-shadow:0 0 10px rgba(140,120,255,.55)}
.bar.qi{height:5px}
#qiF.full{box-shadow:0 0 16px rgba(160,140,255,.95)}
.bar.sp{height:6px}
.bartxt{position:absolute;inset:0;font-size:9px;line-height:9px;text-align:right;padding-right:6px;
  color:rgba(255,255,255,.75);letter-spacing:.5px;font-family:ui-monospace,monospace}

/* 顶部 敌人血条 */
#target{position:absolute;left:50%;top:10px;transform:translateX(-50%);
  width:min(46%,300px);opacity:0;transition:opacity .22s}
#target.on{opacity:1}
#tgtName{font-size:12px;letter-spacing:3px;text-align:center;color:#e6c98a;margin-bottom:5px;
  text-shadow:0 0 8px rgba(0,0,0,.9),0 1px 2px #000}
#tgtBar{height:7px;border-radius:4px;background:rgba(0,0,0,.6);
  box-shadow:inset 0 0 0 1px rgba(200,160,100,.4);overflow:hidden;position:relative}
#tgtFill{position:absolute;inset:0;width:100%;transform-origin:left;border-radius:4px;
  background:linear-gradient(90deg,#7a1414,#c73a2e 65%,#e2624a);transition:width .18s ease-out}

/* 连击数 */
#combo{position:absolute;right:26px;top:26%;text-align:right;opacity:0;transition:opacity .25s}
#combo.on{opacity:1}
#comboBox{font-size:46px;line-height:.95;font-weight:700;color:#ffdf9e;
  text-shadow:0 0 18px rgba(255,160,60,.75),0 2px 6px rgba(0,0,0,.9);font-style:italic}
#comboTag{font-size:12px;letter-spacing:5px;color:#e8b96a;margin-top:2px;text-shadow:0 1px 3px #000}

/* 中央提示 */
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;
  font-size:20px;letter-spacing:6px;color:#f0dcb0;opacity:0;transition:opacity .4s;
  text-shadow:0 0 20px rgba(0,0,0,.95),0 0 40px rgba(220,160,60,.4)}
#toast.on{opacity:1}

/* 底部左：摇杆 */
#joy{position:absolute;left:0;bottom:0;width:46%;height:72%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;left:96px;top:0;width:104px;height:104px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(255,240,210,.09),rgba(255,240,210,.03) 70%,transparent);
  box-shadow:inset 0 0 0 1.5px rgba(230,200,150,.28);}
#joyKnob{position:absolute;left:96px;top:0;width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,rgba(255,246,225,.85),rgba(210,175,120,.55));
  box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 16px rgba(240,205,140,.35);transform:translate(-50%,-50%)}

/* 底部右：战斗按钮 */
#acts{position:absolute;right:0;bottom:0;width:52%;height:78%;pointer-events:none;touch-action:none}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;letter-spacing:1px;color:#f3e5c8;font-family:inherit;
  background:radial-gradient(circle at 38% 32%,rgba(88,72,52,.72),rgba(32,26,20,.68));
  box-shadow:inset 0 0 0 1.2px rgba(215,180,120,.38),0 3px 12px rgba(0,0,0,.42);
  transition:transform .07s,box-shadow .12s,opacity .2s;pointer-events:auto;touch-action:none}
.btn.ult{background:radial-gradient(circle at 38% 32%,rgba(96,80,140,.55),rgba(30,26,44,.72));
  box-shadow:inset 0 0 0 1.2px rgba(160,150,255,.42),0 3px 12px rgba(0,0,0,.42)}
.btn.ult.ready{box-shadow:inset 0 0 0 2px rgba(190,170,255,.95),0 0 26px rgba(150,130,255,.8);color:#e6ddff}
.btn.ult.exec{background:radial-gradient(circle at 38% 32%,rgba(150,90,50,.75),rgba(52,26,16,.78));
  box-shadow:inset 0 0 0 2px rgba(255,190,110,.95),0 0 28px rgba(255,150,60,.85);color:#ffe8c0}
.btn.off{opacity:.3}
.btn:active{transform:scale(.92);box-shadow:inset 0 0 0 2px rgba(255,220,150,.75),0 0 20px rgba(240,190,110,.5)}
#bAtk{right:24px;bottom:26px;width:88px;height:88px;font-size:22px}
#bHeavy{right:118px;bottom:30px;width:62px;height:62px;font-size:16px}
#bDash{right:30px;bottom:120px;width:58px;height:58px;font-size:16px}
#bLock{right:206px;bottom:100px;width:50px;height:50px;font-size:13px}
#bGuard{right:192px;bottom:38px;width:58px;height:58px;font-size:16px}
#bJump{right:114px;bottom:110px;width:54px;height:54px;font-size:16px}
#bUlt{right:22px;bottom:196px;width:54px;height:54px;font-size:15px}
#bFin{right:88px;bottom:190px;width:54px;height:54px;font-size:15px}




/* 招式名 / 蓄力条 */
#moveName{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:17px;
  letter-spacing:6px;color:#f0d8a8;opacity:0;transition:opacity .18s;
  text-shadow:0 0 14px rgba(0,0,0,.9),0 0 26px rgba(255,180,90,.5);white-space:nowrap}
#moveName.on{opacity:1}
#flash{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.85);
  font-size:30px;letter-spacing:10px;color:#ffd88a;opacity:0;
  text-shadow:0 0 24px rgba(255,140,40,.95),0 2px 8px #000;white-space:nowrap}
#flash.on{animation:flashPop .85s ease-out forwards}
@keyframes flashPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}
 22%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
 100%{opacity:0;transform:translate(-50%,-58%) scale(1.0)}}
#chargeWrap{position:absolute;left:50%;top:72%;transform:translateX(-50%);width:150px;height:6px;
  border-radius:3px;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(230,200,140,.35);
  opacity:0;transition:opacity .12s;overflow:hidden}
#chargeWrap.on{opacity:1}
#chargeBar{position:absolute;inset:0;width:0%;border-radius:3px;
  background:linear-gradient(90deg,#c08a3a,#ffd070 70%,#fff0c0)}
#chargeBar.full{box-shadow:0 0 14px rgba(255,210,120,.95)}

/* 加载 */
#boot{position:absolute;inset:0;background:#0b0a09;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#bootT{font-size:26px;letter-spacing:12px;color:#e2c894;text-indent:12px}
#bootS{font-size:12px;letter-spacing:4px;color:#7a6f5e}
#boot.gone{opacity:0;pointer-events:none}

/* 伤害飘字 */
.dmg{position:absolute;transform:translate(-50%,-50%);font-size:22px;font-weight:700;color:#ffe8b0;
  text-shadow:0 0 10px rgba(255,140,40,.9),0 2px 4px #000;pointer-events:none;
  animation:dmgUp .72s ease-out forwards;letter-spacing:1px;font-family:ui-serif,serif}
.dmg.heavy{font-size:31px;color:#ffb060;text-shadow:0 0 16px rgba(255,90,30,1),0 2px 6px #000}
.dmg.crit{font-size:34px;color:#ff8a5a;text-shadow:0 0 22px rgba(255,60,20,1),0 0 40px rgba(255,120,40,.7),0 2px 6px #000}
.dmg.block{font-size:17px;color:#bcd0e8;text-shadow:0 0 10px rgba(140,180,255,.8)}
@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
 18%{opacity:1;transform:translate(-50%,-88%) scale(1.14)}
 100%{opacity:0;transform:translate(-50%,-190%) scale(.94)}}

/* 横屏提示 */
#rotateTip{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:60;pointer-events:none;background:rgba(0,0,0,.76);text-align:center;
  color:#e8dcc0;font-size:19px;letter-spacing:5px;line-height:2}
#rotateTip.on{display:flex}
#rotateTip .ico{display:block;font-size:52px;margin-bottom:16px;color:#e8c884;
  animation:tipSpin 2.2s ease-in-out infinite}
@keyframes tipSpin{0%,55%{transform:rotate(0deg)}75%,100%{transform:rotate(90deg)}}

/* 调试错误条 */
#err{position:fixed;left:0;right:0;top:0;z-index:99;background:rgba(140,20,20,.94);color:#fff;
  font:11px/1.5 ui-monospace,monospace;padding:6px 10px;display:none;white-space:pre-wrap;max-height:40%;overflow:auto}
</style>
</head>
<body>
<div id="stage">
<canvas id="gl"></canvas>

<div id="hud">
  <div id="status">
    <div class="bar"><i id="hpF"></i><span class="bartxt" id="hpT"></span></div>
    <div class="bar sp"><i id="spF"></i></div>
    <div class="bar qi"><i id="qiF"></i></div>
  </div>

  <div id="joyBase"></div><div id="joyKnob"></div>
  <div id="target"><div id="tgtName"></div><div id="tgtBar"><i id="tgtFill"></i></div></div>

  <div id="combo"><div id="comboBox">0</div><div id="comboTag">连击</div></div>
  <div id="toast"></div>
  <div id="moveName"></div>
  <div id="flash"></div>
  <div id="chargeWrap"><div id="chargeBar"></div></div>

  <div id="joy"></div>
  <div id="acts">
    <div class="btn" id="bAtk">斩</div>
    <div class="btn" id="bHeavy">重</div>
    <div class="btn" id="bDash">闪</div>
    <div class="btn" id="bJump">跳</div>
    <div class="btn" id="bGuard">挡</div>
    <div class="btn ult" id="bUlt">绝</div>
  </div>
</div>

<div id="boot"><div id="bootT">江 湖</div><div id="bootS">正在点灯</div></div>
</div>
<div id="rotateTip">
  <div><span class="ico">⟳</span>请把手机横过来握持</div>
</div>
<div id="err"></div>

<script src="js/three.min.js"></script>
<script src="js/core.js?v=93"></script>
<script src="js/terrain.js?v=93"></script>
<script src="js/world.js?v=93"></script>
<script src="js/fx.js?v=93"></script>
<script src="js/slash.js?v=93"></script>
<script src="js/weapon.js?v=93"></script>
<script src="js/weapons.js?v=93"></script>
<script src="js/combat.js?v=93"></script>
<script src="js/hero.js?v=93"></script>
<script src="js/foe.js?v=93"></script>
<script src="js/ui.js?v=93"></script>
<script src="js/game.js?v=93"></script>
<script>
J.showRotateTip = function () {
  var el = document.getElementById('rotateTip');
  if (!el) return;
  if (!J.Stage.rotated) { el.classList.remove('on'); return; }
  el.classList.add('on');
  clearTimeout(J._tipT);
  J._tipT = setTimeout(function () { el.classList.remove('on'); }, 2800);
};
</script>
</body>
</html>
